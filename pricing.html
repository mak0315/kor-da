<h1>Pricing & Fees</h1>
<p><strong>Last updated:</strong> September 2026</p>
<h2>1. Property Prices</h2>
<p>Property prices on Kor Da are displayed in Pakistani Rupees (PKR). Hosts set their own property rates, subject to Kor Da's marketplace terms and any applicable listing requirements.</p>
<p>The price shown for a property reflects the nightly or stay rate set by the host. Actual charges always depend on the specific dates, length of stay, number of guests, and the property's own terms.</p>
<h2>2. What Guests Pay</h2>
<p>The total amount payable by a guest is clearly shown before confirmation and payment. Any applicable service, platform, cleaning, or other charges are disclosed before the guest confirms and pays for the booking.</p>
<ul>
<li>All prices and charges are displayed in PKR.</li>
<li>The total shown at confirmation is the amount you are asked to pay.</li>
<li>No charges are added without being clearly disclosed before payment.</li>
</ul>
<h2>3. Host Pricing and Marketplace Commission</h2>
<p>Hosts set their property rates freely, subject to Kor Da's marketplace terms. Kor Da may charge a marketplace or service commission according to the applicable host agreement. This commission is not charged to guests.</p>
<p>Details of host commission, payout timing, and related arrangements are provided in the applicable host agreement and terms.</p>
<h2>4. Payments and Processing</h2>
<p>All payments are processed in PKR through the payment methods available on the platform. Taxes or payment-processing charges may apply where legally or operationally applicable. Any such charges that apply to a booking are disclosed before the guest confirms and pays.</p>
<h2>5. Cancellations and Refunds</h2>
<p>Cancellation and refund conditions depend on the cancellation terms applicable to each booking and Kor Da's policies. Please see the <a href="refund-policy.html">Refund & Cancellation Policy</a> and the <a href="terms.html">Terms & Conditions</a> for details.</p>
<h2>6. Questions About Pricing</h2>
<p>If you have any questions about a price, charge, or fee, contact us by WhatsApp at 0315-5881733 or email kordapakistan@gmail.com, or visit our <a href="contact.html">Contact page</a>.</p>
