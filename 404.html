<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>404 — Page Not Found | Kor Da</title><meta name="description" content="The page you're looking for doesn't exist. Browse verified short stays in Islamabad or return home."><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://www.kordaa.com/404.html"><link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="stylesheet" href="assets/css/main.css"><style>
  .e404{min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px;background:var(--gbg)}

<body>
<div class="e404">
