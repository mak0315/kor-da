backend:
  name: github
  repo: mak0315/kor-da
  branch: main
  base_url: "https://korda-amber.vercel.app"
  auth_endpoint: "/auth"

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "properties"
    label: "Properties"
    files:
      - label: "All Properties"
        name: "properties"
        file: "content/compiled/properties.json"
        fields:
          - label: "Properties"
            name: "properties"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Type", name: "type", widget: "select", options: ["Studio / 1-Bed","Full Apartment","Serviced Apartment","Guest House","Room","House","Villa"] }
              - { label: "City", name: "city", widget: "string" }
              - { label: "Area", name: "area", widget: "string" }
              - { label: "Price per Night (PKR)", name: "price", widget: "number", min: 0 }
              - { label: "Bedrooms", name: "beds", widget: "string" }
              - { label: "Bathrooms", name: "baths", widget: "number", min: 0 }
              - { label: "Max Guests", name: "maxGuests", widget: "number", min: 1 }
              - { label: "Category", name: "category", widget: "select", options: ["business","family","budget","medical","university","all"] }
              - { label: "Featured", name: "featured", widget: "boolean", default: false }
              - { label: "Amenities", name: "amenities", widget: "list", allow_add: true, field: { label: "Amenity", name: "amenity", widget: "string" } }
              - { label: "Main Photo", name: "image", widget: "image" }
              - { label: "Gallery", name: "gallery", widget: "list", allow_add: true, field: { label: "Photo", name: "photo", widget: "image" } }
              - { label: "WhatsApp", name: "waContact", widget: "string", default: "923155881733" }
              - { label: "Description", name: "body", widget: "text", rows: 4 }
              - { label: "ID", name: "id", widget: "string", pattern: ["^[a-z0-9-]+$", "lowercase-hyphens-only"] }

  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text", rows: 3 }
      - { label: "Author", name: "author", widget: "string", default: "Kor Da Team" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "Category", name: "category", widget: "select", options: ["tips","guide","news","islamabad"] }
      - { label: "Tags", name: "tags", widget: "list", allow_add: true, field: { label: "Tag", name: "tag", widget: "string" } }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "testimonials"
    label: "Testimonials"
    folder: "content/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Review", name: "content", widget: "text", rows: 4 }
      - { label: "Rating", name: "rating", widget: "number", min: 1, max: 5 }

  - name: "faqs"
    label: "FAQs"
    folder: "content/faqs"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Answer", name: "answer", widget: "text", rows: 4 }
      - { label: "Sort Order", name: "order", widget: "number", min: 0 }
