<h1>Refund & Cancellation Policy</h1>
<p><strong>Last updated:</strong> September 2026</p>
<h2>1. Cancellation by Guests</h2>
<p>Guests may request to cancel a booking at any time according to the cancellation terms shown for their booking or property at the time of reservation.</p>
<p>Refund eligibility depends on the applicable cancellation policy of the property and the circumstances of the cancellation. Some bookings may be fully or partially refundable before check-in, while others may be subject to specific cancellation conditions. The terms displayed at the time of booking apply.</p>
<h2>2. Host Cancellations or Unavailable Properties</h2>
<p>If a host cancels a confirmed booking, cannot provide the booked accommodation, or fails to provide reasonable check-in access, the guest should contact Kor Da as soon as possible.</p>
<p>When a host cancels a confirmed booking, the guest receives a full refund of the booking amount and a PKR 1,000 credit toward a future booking. Depending on the circumstances and availability, Kor Da may also help the guest find alternative accommodation.</p>
<h2>3. Property That Does Not Match the Listing</h2>
<p>If a property is materially different from its listing description, unavailable, or unsuitable due to a verified issue caused by the host, Kor Da may provide an appropriate refund or alternative accommodation where possible.</p>
<p>Guests should report such issues as soon as possible with supporting evidence, such as photographs, videos, or messages exchanged with the host.</p>
<h2>4. How Refunds Are Processed</h2>
<p>Approved refunds are processed through the original payment method where technically possible. Processing, bank, or payment-gateway charges may be non-refundable where applicable.</p>
<p>Refund timelines depend on the payment provider or bank. Once a refund is approved, processing is normally initiated within a few business days, and the time for the amount to appear in your account depends on your bank or payment provider.</p>
<h2>5. Refunds Are Not Automatic</h2>
<p>Kor Da does not promise automatic refunds for guest preference changes, late arrival, early departure, or failure to use the accommodation, unless the applicable cancellation terms allow it.</p>
<h2>6. Disputes and Refund Requests</h2>
<p>If you believe a refund applies, report the issue to Kor Da as soon as possible with relevant evidence. Contact us by WhatsApp at 0315-5881733 or email kordapakistan@gmail.com, and include your booking reference and a description of the issue.</p>
<p>Kor Da reserves the right to review each request individually based on the available evidence, the applicable booking and cancellation terms, and this policy, together with the Guest & Host Dispute and Resolution Policy in our Terms & Conditions.</p>
